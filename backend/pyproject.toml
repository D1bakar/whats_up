[project]
name = "whatsapp-platform-backend"
version = "0.2.0"
description = "WhatsApp Business Platform API"
requires-python = ">=3.12,<3.15"
dependencies = [
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.6.0",
    "redis>=5.2.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "structlog>=24.4.0",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.20.0",
    "httpx>=0.28.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint.per-file-ignores]
"app/api/**/*.py" = ["B008", "BLE001"]
"app/webhooks/**/*.py" = ["B008"]
"app/services/outbound.py" = ["S311"]
"app/db/migrations/**/*.py" = ["I001", "UP007", "UP035"]
"app/models/contact.py" = ["F821", "UP037"]
"app/models/conversation.py" = ["F821", "UP037"]
"app/models/conversation_session.py" = ["F821", "UP037"]
"app/models/message.py" = ["F821", "UP037"]


[tool.mypy]
python_version = "3.12"
strict = true
plugins = []
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["app.models.contact", "app.models.conversation", "app.models.conversation_session", "app.models.message"]
disable_error_code = ["name-defined"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "ollama: optional live Ollama integration tests (set RUN_OLLAMA_INTEGRATION=1)",
]
